name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Cancel a stale run when new commits land on the same branch/PR — no point finishing a check
# against code that's already been superseded.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    # A throwaway Postgres for this run only — deliberately not the Neon dev database, and not
    # the contributor's local Docker container. Every job gets a clean, disposable instance.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: my_marketplace_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # vitest/global-setup.ts creates+migrates this database itself; no dev DB is ever touched.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/my_marketplace_ci?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/my_marketplace_ci_test?schema=public
      NEXTAUTH_URL: http://localhost:3000
      # authorize()/resetPassword hash real passwords with bcrypt even in tests — a throwaway
      # value is fine, nothing here is a real secret.
      AUTH_SECRET: ci-only-placeholder-not-a-real-secret
      # src/lib/stripe.ts constructs a real Stripe client at MODULE IMPORT time and throws if this
      # is unset — reachable from `next build` (the webhook route) even though nothing in CI ever
      # calls Stripe for real (see vitest/setup.ts's mock for the test run's own Stripe calls).
      # Confirmed locally: `next build` fails without this, succeeds with any well-formed value.
      STRIPE_SECRET_KEY: sk_test_ci_placeholder_not_a_real_key

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Generate Next.js types
        # tsconfig.json's "include" references next-env.d.ts and .next/types/**/*.ts — both are
        # gitignored and normally created the first time any `next` command runs. A fresh CI
        # checkout has neither yet, so a bare `tsc --noEmit` fails before it even reaches this
        # project's own code. `next typegen` creates just those files without a full build.
        run: npx next typegen

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        # Mirrors Railway's actual build step (prisma generate && next build) — catches
        # Next.js-specific issues (route conflicts, server/client boundary violations) that
        # tsc/eslint don't. All routes in this app are dynamic (ƒ), so next build never queries
        # the DB at build time — the Postgres service above isn't required for this step, but
        # DATABASE_URL still needs to resolve to a well-formed connection string.
        run: npm run build

      - name: Audit dependencies (high severity and above)
        # Non-blocking: as of this workflow's addition, `npm audit` reports 4 high-severity
        # issues entirely inside Prisma's own CLI tooling (a transitive mysql2 dependency this
        # Postgres-only app never uses) — the only fix available is a forced downgrade to
        # Prisma 6, undoing the project's deliberate v7 upgrade. Kept as a visible warning
        # rather than a hard gate until upstream Prisma resolves it; revisit this if a *new*
        # finding shows up that isn't this one.
        run: npm audit --audit-level=high
        continue-on-error: true
